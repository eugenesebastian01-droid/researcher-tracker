<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>International Research Portfolio Tracker – Flinders University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#4A7FC1;--teal:#2EAD86;--gold:#E8B84B;--red:#E05C5C;--green:#5DBD7A;--purple:#8B7FE8;
  --bg:#0F1117;--surface:#1A1D27;--surface2:#22263A;--border:#2C3050;--border2:#3A3F66;
  --text:#E8EAF0;--text2:#8B90A8;--text3:#555975;
  --success-bg:#0D2B1A;--success-fg:#5DBD7A;
  --warn-bg:#2B1F08;--warn-fg:#E8B84B;
  --danger-bg:#2B0F0F;--danger-fg:#E05C5C;
  --info-bg:#0D1A2B;--info-fg:#4A9FE0;
  --sidebar:200px;--radius:8px;--radius-lg:12px;
  color-scheme:dark;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
#app{display:flex;min-height:100vh}

/* sidebar */
#sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
#logo{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
#logo .l1{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
#logo .l2{font-size:13px;font-weight:500;color:var(--text);margin-top:3px;line-height:1.3}
nav{flex:1;padding:10px 0;overflow-y:auto}
.nav-group{padding:10px 12px 3px;font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.07em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 16px;cursor:pointer;font-size:13px;color:var(--text2);border-radius:6px;margin:1px 8px;transition:all .12s}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--surface2);color:var(--text);font-weight:500}
.nav-item svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sidebar-foot{padding:12px 16px;border-top:1px solid var(--border)}
.reset-btn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);cursor:pointer;background:none;border:none;font-family:inherit;width:100%;padding:0;transition:color .1s}
.reset-btn:hover{color:var(--danger-fg)}
.foot-note{font-size:10px;color:var(--text3);margin-top:5px}

/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-bottom:1px solid var(--border);background:var(--surface);gap:12px;position:sticky;top:0;z-index:10}
#page-title{font-size:15px;font-weight:500}
#topbar-actions{display:flex;gap:8px;align-items:center}
#content{flex:1;overflow-y:auto;padding:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;background:var(--surface);color:var(--text);font-family:inherit;transition:background .1s;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:#2A5298;color:#fff;border-color:transparent}
.btn.primary:hover{opacity:.88}
.btn.danger{background:var(--danger-bg);color:var(--danger-fg);border-color:var(--danger-fg)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* kpi */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px}
.kpi-label{font-size:10px;color:var(--text2);font-weight:500;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.kpi-value{font-size:28px;font-weight:500;line-height:1}
.kpi-value.danger{color:var(--red)}
.kpi-value.warn{color:var(--gold)}
.kpi-value.success{color:var(--green)}
.kpi-value.info{color:var(--purple)}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:5px}

/* cards */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:18px}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.section-title{font-size:13px;font-weight:500}

/* search */
.search-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text3)}
.search-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-input{width:100%;padding:6px 10px 6px 30px;font-size:12px;font-family:inherit;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text)}
.search-input:focus{outline:none;border-color:var(--navy)}
.filter-select{padding:6px 8px;font-size:12px;font-family:inherit;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer}
.filter-clear{font-size:11px;color:var(--text3);cursor:pointer;padding:4px 8px;border-radius:4px;border:none;background:none;font-family:inherit}
.filter-clear:hover{color:var(--text)}
.result-count{font-size:11px;color:var(--text3);white-space:nowrap;margin-left:auto}
mark{background:#5A3E00;color:#FAC775;border-radius:2px;padding:0 2px}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 14px;text-align:left;font-size:11px;font-weight:500;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface2);cursor:pointer;user-select:none}
th:hover{color:var(--text)}
.sort-arrow{font-size:9px;margin-left:3px;opacity:.4}
th.sorted .sort-arrow{opacity:1}
td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.cell-id{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3)}
.cell-trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row-actions{display:flex;gap:4px}
.row-btn{background:none;border:none;cursor:pointer;padding:4px 5px;border-radius:4px;color:var(--text3);line-height:1}
.row-btn:hover{background:var(--surface2);color:var(--text)}
.row-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* badges */
.badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap}
.b-active{background:#0D2B1A;color:#5DBD7A}
.b-pipeline{background:#0D1A2B;color:#4A9FE0}
.b-hold{background:#2B1F08;color:#E8B84B}
.b-completed{background:var(--surface2);color:var(--text2)}
.b-cancelled{background:#2B0F0F;color:#E05C5C}
.b-high{background:#2B0F0F;color:#E05C5C}
.b-medium{background:#2B1F08;color:#E8B84B}
.b-low{background:#0D2B1A;color:#5DBD7A}
.b-yes{background:#2B1F08;color:#E8B84B}
.b-no{background:var(--surface2);color:var(--text2)}
.b-t1{background:#0D1A2B;color:#4A9FE0}
.b-t2{background:#1E1E2B;color:#8B90A8}
.b-t3{background:#0D2B1A;color:#5DBD7A}
.b-awarded{background:#0D2B1A;color:#5DBD7A}
.b-declined{background:#2B0F0F;color:#E05C5C}
.b-enrolled{background:#0D2B1A;color:#5DBD7A}
.b-prospecting{background:#0D1A2B;color:#4A9FE0}
.b-application{background:#2B1F08;color:#E8B84B}

/* modal */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
#modal{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border2);width:580px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.12)}
#modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border)}
#modal-title{font-size:14px;font-weight:500}
#modal-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text2);line-height:1;padding:2px 6px;border-radius:4px}
#modal-close:hover{background:var(--surface2)}
#modal-body{overflow-y:auto;padding:20px;flex:1}
#modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* form */
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text)}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--navy)}
.form-row textarea{resize:vertical;min-height:74px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row.req label::after{content:" *";color:var(--danger-fg)}

/* onboarding */
.onboard{max-width:520px;margin:0 auto;padding:4px 0 20px}
.onboard-hero{text-align:center;padding:24px 20px 18px}
.onboard-hero h1{font-size:20px;font-weight:500;margin-bottom:8px}
.onboard-hero p{font-size:13px;color:var(--text2);line-height:1.6}
.steps{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;cursor:pointer;transition:border-color .15s}
.step:hover{border-color:var(--border2)}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;color:var(--text2)}
.step.done .step-num{background:var(--success-bg);color:var(--success-fg);border-color:var(--success-fg)}
.step-content h3{font-size:13px;font-weight:500;margin-bottom:4px}
.step-content p{font-size:12px;color:var(--text2);line-height:1.55}
.step-action{margin-top:10px}
.onboard-note{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;font-size:12px;color:var(--text2);line-height:1.6;text-align:center}

/* confirm */
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:360px;margin:60px auto 0}
.confirm-box h3{font-size:15px;font-weight:500;margin-bottom:10px}
.confirm-box p{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:18px}
.confirm-box .btn-row{display:flex;gap:8px;justify-content:flex-end}

/* weekly */
.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.week-section{border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.week-head{padding:10px 14px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px}
.week-head svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wh-dec{background:#2B1F08;color:#E8B84B}
.wh-over{background:#2B0F0F;color:#E05C5C}
.wh-due{background:#0D1A2B;color:#4A9FE0}
.wh-risk{background:#2B0F0F;color:#E05C5C}
.week-body{padding:10px 14px;font-size:12px}
.week-item{padding:6px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px}
.week-item:last-child{border-bottom:none}
.wi-id{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);width:60px;flex-shrink:0;padding-top:2px}
.wi-body{flex:1}
.wi-title{font-weight:500;margin-bottom:2px}
.wi-meta{color:var(--text2)}
.none-msg{padding:8px 0;color:var(--text3);font-size:12px}
#weekly-text{width:100%;font-family:'DM Mono',monospace;font-size:11px;border:1px solid var(--border2);border-radius:var(--radius);padding:13px;min-height:200px;background:var(--surface2);color:var(--text);resize:vertical}

/* dashboard grid */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.empty-state{text-align:center;padding:44px 20px;color:var(--text3)}
.empty-state svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 10px;display:block}
.empty-state p{font-size:13px}
</style>
</head>
<body>
<div id="app">
<div id="sidebar">
  <div id="logo">
    <div class="l1">Flinders University</div>
    <div class="l2">International Research<br>Portfolio Tracker</div>
  </div>
  <nav>
    <div class="nav-group">Overview</div>
    <div class="nav-item active" data-page="dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard

    </div>
  </nav>
  <div id="sidebar-foot">
    <button class="reset-btn" onclick="confirmReset()">
      <svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3"/></svg>
      Reset to sample data
    </button>
    <div class="foot-note">Saves automatically in this browser</div>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <div id="page-title">Dashboard</div>
    <div id="topbar-actions"></div>
  </div>
  <div id="content"></div>
</div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <div id="modal-head">
      <div id="modal-title">Add record</div>
      <button id="modal-close" aria-label="Close">&#x2715;</button>
    </div>
    <div id="modal-body"></div>
    <div id="modal-foot">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn primary" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
const STORE={
  get(k){try{return JSON.parse(localStorage.getItem('irpt_'+k))||[]}catch{return[]}},
  set(k,v){localStorage.setItem('irpt_'+k,JSON.stringify(v))},
  clear(){['projects','tasks','partners','funding','hdr','evidence'].forEach(k=>localStorage.removeItem('irpt_'+k))},

      {id:'PROJ-004',title:'Indonesia Digital Health Capacity Building',unit:'Nursing & Health Sciences',status:'Active',phase:'Delivery',region:'Southeast Asia',country:'Indonesia',focus:'Health & Wellbeing',partner_id:'PART-004',partner:'Universitas Indonesia',scheme:'DFAT',start:'2023-07-01',end:'2025-06-30',target:320000,actual:310000,hdr_target:2,hdr_actual:2,risk:'Low',decision:'No',decision_detail:'',lead:'Dr. Sari Wijaya',notes:'Approaching closure; impact report due August',update_flag:'Exclude',updated:n},

    this.set('tasks',[
      {id:'TASK-001',title:'Finalise MoU renewal draft',project_id:'PROJ-001',project:'Vietnam Blue Economy Research Partnership',partner_id:'PART-001',partner:'Vietnam National University',owner:'Prof. Jane Smith',status:'In Progress',priority:'High',due:'2025-05-15',completed:'',decision:'Yes',decision_detail:'DVC approval required before signing',blocker:'',risk:'Medium',notes:'Draft circulated; awaiting VNU legal review',update_flag:'Include'},

// ── Weekly ─────────────────────────────────────────────────────────────────────
function rweek(c,a){
  const proj=STORE.get('projects'),tasks=STORE.get('tasks'),funding=STORE.get('funding');
  const today=new Date().toISOString().slice(0,10);
  const dec=[...proj.filter(p=>p.decision==='Yes'&&p.update_flag==='Include').map(p=>({id:p.id,title:p.title,detail:p.decision_detail,owner:p.lead,risk:p.risk})),...tasks.filter(t=>t.decision==='Yes'&&t.status!=='Completed'&&t.update_flag==='Include').map(t=>({id:t.id,title:t.title,detail:t.decision_detail,owner:t.owner,risk:t.risk}))];
  const ovr=tasks.filter(t=>t.due<today&&t.status!=='Completed'&&t.status!=='Cancelled'&&t.update_flag==='Include');
  const dw=tasks.filter(t=>t.due>=today&&t.status!=='Completed'&&t.update_flag==='Include');
  const hr=[...proj.filter(p=>p.risk==='High'&&p.status==='Active'&&p.update_flag==='Include').map(p=>({id:p.id,title:p.title,owner:p.lead})),...funding.filter(f=>f.risk==='High'&&f.update_flag==='Include').map(f=>({id:f.id,title:f.title,owner:f.lead}))];
  const wi=(arr,fn)=>arr.length?arr.map(fn).join(''):`<div class="none-msg">None this week</div>`;
  a.innerHTML=`<button class="btn primary" onclick="copyWeekly()">&#128203; Copy as text</button>`;
  c.innerHTML=`
  <div class="week-grid">
    <div>
      <div class="week-section"><div class="week-head wh-dec">&#9888; Decisions required (${dec.length})</div><div class="week-body">${wi(dec,d=>`<div class="week-item"><div class="wi-id">${d.id}</div><div class="wi-body"><div class="wi-title">${d.title}</div><div class="wi-meta">${d.detail||'—'} &middot; ${d.owner}</div></div>${rb(d.risk)}</div>`)}</div></div>
      <div class="week-section"><div class="week-head wh-over">&#128336; Overdue (${ovr.length})</div><div class="week-body">${wi(ovr,t=>`<div class="week-item"><div class="wi-id">${t.id}</div><div class="wi-body"><div class="wi-title">${t.title}</div><div class="wi-meta">Due ${t.due} &middot; ${t.owner}</div></div>${pb(t.priority)}</div>`)}</div></div>
    </div>
    <div>
      <div class="week-section"><div class="week-head wh-due">&#128197; Due this week (${dw.length})</div><div class="week-body">${wi(dw,t=>`<div class="week-item"><div class="wi-id">${t.id}</div><div class="wi-body"><div class="wi-title">${t.title}</div><div class="wi-meta">Due ${t.due} &middot; ${t.owner}</div></div>${pb(t.priority)}</div>`)}</div></div>
      <div class="week-section"><div class="week-head wh-risk">&#128293; High-risk items (${hr.length})</div><div class="week-body">${wi(hr,r=>`<div class="week-item"><div class="wi-id">${r.id}</div><div class="wi-body"><div class="wi-title">${r.title}</div><div class="wi-meta">${r.owner}</div></div></div>`)}</div></div>
    </div>
  </div>
  <div class="section"><div class="section-header"><span class="section-title">Plain text export — copy and paste into email</span></div>
    <div style="padding:16px"><textarea id="weekly-text">${wtext(dec,ovr,dw,hr)}</textarea></div>
  </div>`;
}
function wtext(dec,ovr,dw,hr){
  const d=new Date();
  let t=`INTERNATIONAL RESEARCH PORTFOLIO – WEEKLY UPDATE\nWeek of ${d.toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'})}\n${'-'.repeat(60)}\n\n`;
  t+=`1. DECISIONS REQUIRED\n`;dec.length?dec.forEach(x=>t+=`   [${x.id}] ${x.title}\n         -> ${x.detail||'(see record)'} | ${x.owner}\n`):t+='   None\n';
  t+=`\n2. OVERDUE TASKS\n`;ovr.length?ovr.forEach(x=>t+=`   [${x.id}] ${x.title} (due ${x.due}) | ${x.owner}\n`):t+='   None\n';
  t+=`\n3. DUE THIS WEEK\n`;dw.length?dw.forEach(x=>t+=`   [${x.id}] ${x.title} (due ${x.due}) | ${x.owner}\n`):t+='   None\n';
  t+=`\n4. HIGH-RISK ITEMS\n`;hr.length?hr.forEach(x=>t+=`   [${x.id}] ${x.title} | ${x.owner}\n`):t+='   None\n';
  t+=`\n5. PROGRESS THIS WEEK\n   (add narrative here)\n\n6. COMING UP\n   (add items here)\n`;
  return t;
}
function copyWeekly(){
  const ta=document.getElementById('weekly-text');
  if(!ta)return;
  navigator.clipboard.writeText(ta.value).then(()=>{
    const b=document.querySelector('#topbar-actions .btn');
    if(b){const o=b.innerHTML;b.innerHTML='&#10003; Copied!';setTimeout(()=>b.innerHTML=o,2000);}
  });
}

function rtable(c,a,entity){
  const cfg=tcfg(entity);
  a.innerHTML=`<button class="btn primary" onclick="openAdd('${entity}')">+ Add ${cfg.label}</button>`;
  const ss=gs(entity);
  const all=STORE.get(entity);
  let data=all.filter(row=>{
    if(ss.q&&!Object.values(row).some(v=>String(v||'').toLowerCase().includes(ss.q.toLowerCase())))return false;
    for(const[k,v]of Object.entries(ss.f)){if(v&&row[k]!==v)return false;}
    return true;
  });
  if(ss.sort.col){const{col,dir}=ss.sort;data=[...data].sort((a,b)=>{const av=String(a[col]||'').toLowerCase(),bv=String(b[col]||'').toLowerCase();return dir==='asc'?av.localeCompare(bv):bv.localeCompare(av);});}
  const flt=(cfg.filters||[]).map(f=>`<select class="filter-select" onchange="setF('${entity}','${f.key}',this.value)"><option value="">${f.label}</option>${f.opts.map(o=>`<option value="${o}"${ss.f[f.key]===o?' selected':''}>${o}</option>`).join('')}</select>`).join('');
  const hasA=ss.q||Object.values(ss.f).some(v=>v);
  c.innerHTML=`<div class="section">
    <div class="search-bar">
      <div class="search-wrap"><div class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
        <input class="search-input" type="search" placeholder="Search ${cfg.label}s…" value="${ss.q}" oninput="setSrch('${entity}',this.value)">
      </div>
      ${flt}
      ${hasA?`<button class="filter-clear" onclick="clrSrch('${entity}')">&#x2715; Clear</button>`:''}
      <span class="result-count">${data.length} of ${all.length}</span>
    </div>
    <div class="tbl-wrap"><table>
      <tr>${cfg.cols.map(col=>{const srt=ss.sort.col===col.key;return`<th class="${srt?'sorted':''}" onclick="toggleSort('${entity}','${col.key}')">${col.label}<span class="sort-arrow">${srt?(ss.sort.dir==='asc'?'↑':'↓'):'↕'}</span></th>`;}).join('')}<th style="width:60px"></th></tr>
      ${data.length?data.map(row=>{const oi=all.indexOf(row);return`<tr>${cfg.cols.map(col=>`<td>${rc(col,row,ss.q)}</td>`).join('')}
        <td><div class="row-actions">
          <button class="row-btn" onclick="openEdit('${entity}',${oi})" title="Edit"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="row-btn" onclick="delRow('${entity}',${oi})" title="Delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
        </div></td></tr>`;}).join(''):`<tr><td colspan="${cfg.cols.length+1}"><div class="empty-state"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>${hasA?'No records match your search.':'No records yet. Click "+ Add '+cfg.label+'" to get started.'}</p></div></td></tr>`}
    </table></div></div>`;
}
function setSrch(e,q){gs(e).q=q;rp(page);}
function setF(e,k,v){gs(e).f[k]=v;rp(page);}
function clrSrch(e){const s=gs(e);s.q='';s.f={};rp(page);}
function toggleSort(e,col){const s=gs(e);s.sort=s.sort.col===col?{col,dir:s.sort.dir==='asc'?'desc':'asc'}:{col,dir:'asc'};rp(page);}

function rc(col,row,q=''){
  const v=row[col.key]||'';
  if(col.badge==='status')return sb(v);if(col.badge==='risk')return rb(v);if(col.badge==='priority')return pb(v);
  if(col.badge==='decision')return db(v);if(col.badge==='tier')return tb(v);if(col.badge==='fundstatus')return fsb(v);if(col.badge==='hdrstatus')return hsb(v);
  if(col.money)return v?'$'+Number(v).toLocaleString():'—';
  const d=hl(String(v||'—'),q);
  if(col.trunc)return`<span class="cell-trunc" style="max-width:${col.trunc}px" title="${String(v).replace(/"/g,'&quot;')}">${d}</span>`;
  if(col.mono)return`<span class="cell-id">${d}</span>`;
  return d;
}

function sb(v){const m={Active:'b-active',Pipeline:'b-pipeline','On Hold':'b-hold',Completed:'b-completed',Cancelled:'b-cancelled'};return`<span class="badge ${m[v]||'b-completed'}">${v||'—'}</span>`;}
function rb(v){const m={High:'b-high',Medium:'b-medium',Low:'b-low'};return v?`<span class="badge ${m[v]||''}">${v}</span>`:'—';}
function pb(v){const m={Critical:'b-high',High:'b-high',Medium:'b-medium',Low:'b-low'};return v?`<span class="badge ${m[v]||''}">${v}</span>`:'—';}
function db(v){return v?`<span class="badge ${v==='Yes'?'b-yes':'b-no'}">${v}</span>`:'—';}
function tb(v){if(!v)return'—';return`<span class="badge ${v.includes('1')?'b-t1':v.includes('2')?'b-t2':'b-t3'}">${v}</span>`;}
function fsb(v){const m={Awarded:'b-awarded',Declined:'b-declined',Identified:'b-pipeline','EOI Submitted':'b-hold','Full Application':'b-hold','Under Review':'b-pipeline'};return v?`<span class="badge ${m[v]||'b-completed'}">${v}</span>`:'—';}
function hsb(v){const m={Enrolled:'b-enrolled',Prospecting:'b-prospecting',Application:'b-application',Completed:'b-completed',Confirmed:'b-active'};return v?`<span class="badge ${m[v]||'b-completed'}">${v}</span>`:'—';}

function tcfg(e){return{
  projects:{label:'project',filters:[{key:'status',label:'All statuses',opts:LISTS.status},{key:'region',label:'All regions',opts:LISTS.region},{key:'risk',label:'All risk levels',opts:LISTS.risk},{key:'focus',label:'All focus areas',opts:LISTS.focus}],cols:[{key:'id',label:'ID',mono:true},{key:'title',label:'Title',trunc:220},{key:'status',label:'Status',badge:'status'},{key:'region',label:'Region'},{key:'partner',label:'Partner',trunc:160},{key:'lead',label:'Lead'},{key:'risk',label:'Risk',badge:'risk'},{key:'decision',label:'Decision?',badge:'decision'},{key:'end',label:'End date'}]},
  tasks:{label:'task',filters:[{key:'status',label:'All statuses',opts:LISTS.taskStatus},{key:'priority',label:'All priorities',opts:LISTS.priority},{key:'risk',label:'All risk levels',opts:LISTS.risk},{key:'decision',label:'Decision?',opts:LISTS.yesno}],cols:[{key:'id',label:'ID',mono:true},{key:'title',label:'Task',trunc:220},{key:'project_id',label:'Project',mono:true},{key:'owner',label:'Owner'},{key:'status',label:'Status',badge:'status'},{key:'priority',label:'Priority',badge:'priority'},{key:'due',label:'Due'},{key:'decision',label:'Decision?',badge:'decision'}]},
  partners:{label:'partner',filters:[{key:'region',label:'All regions',opts:LISTS.region},{key:'tier',label:'All tiers',opts:LISTS.tier},{key:'type',label:'All types',opts:LISTS.partnerType},{key:'risk',label:'All risk levels',opts:LISTS.risk}],cols:[{key:'id',label:'ID',mono:true},{key:'name',label:'Institution',trunc:220},{key:'country',label:'Country'},{key:'tier',label:'Tier',badge:'tier'},{key:'agreement',label:'Agreement'},{key:'expiry',label:'Expiry'},{key:'lead',label:'Flinders Lead'},{key:'risk',label:'Risk',badge:'risk'}]},
  funding:{label:'funding opportunity',filters:[{key:'scheme',label:'All schemes',opts:LISTS.scheme},{key:'status',label:'All statuses',opts:LISTS.fundingStatus},{key:'region',label:'All regions',opts:LISTS.region},{key:'risk',label:'All risk levels',opts:LISTS.risk}],cols:[{key:'id',label:'ID',mono:true},{key:'title',label:'Opportunity',trunc:220},{key:'scheme',label:'Scheme'},{key:'status',label:'Status',badge:'fundstatus'},{key:'requested',label:'Requested ($)',money:true},{key:'lead',label:'Lead'},{key:'risk',label:'Risk',badge:'risk'},{key:'decision',label:'Decision?',badge:'decision'}]},
  hdr:{label:'HDR record',filters:[{key:'type',label:'All types',opts:LISTS.hdrType},{key:'status',label:'All statuses',opts:LISTS.hdrStatus},{key:'region',label:'All regions',opts:LISTS.region},{key:'risk',label:'All risk levels',opts:LISTS.risk}],cols:[{key:'id',label:'ID',mono:true},{key:'name',label:'Candidate / Initiative',trunc:200},{key:'type',label:'Type'},{key:'status',label:'Status',badge:'hdrstatus'},{key:'partner',label:'Partner',trunc:160},{key:'flinders_sup',label:'Supervisor'},{key:'risk',label:'Risk',badge:'risk'}]},
  evidence:{label:'evidence record',filters:[{key:'type',label:'All types',opts:LISTS.evidenceType},{key:'update_flag',label:'Weekly flag',opts:LISTS.flag}],cols:[{key:'id',label:'ID',mono:true},{key:'title',label:'Title',trunc:220},{key:'type',label:'Type'},{key:'date',label:'Date'},{key:'project_id',label:'Project',mono:true},{key:'added_by',label:'Added by'}]},
}[e];}

// ── Modal ──────────────────────────────────────────────────────────────────────
let mEnt='',mIdx=-1;
function openAdd(e){mEnt=e;mIdx=-1;document.getElementById('modal-title').textContent='Add '+tcfg(e).label;document.getElementById('modal-body').innerHTML=bf(e,{});document.getElementById('modal-overlay').classList.add('open');}
function openEdit(e,i){const row=STORE.get(e)[i];mEnt=e;mIdx=i;document.getElementById('modal-title').textContent='Edit record';document.getElementById('modal-body').innerHTML=bf(e,row);document.getElementById('modal-overlay').classList.add('open');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function delRow(e,i){if(!confirm('Delete this record? This cannot be undone.'))return;const d=STORE.get(e);d.splice(i,1);STORE.set(e,d);rp(page);}
function saveModal(){
  const inputs=[...document.getElementById('modal-body').querySelectorAll('input,select,textarea')];
  const row={};inputs.forEach(el=>{if(el.dataset.field)row[el.dataset.field]=el.value;});
  const data=STORE.get(mEnt);
  if(mIdx===-1){const px={projects:'PROJ',tasks:'TASK',partners:'PART',funding:'FUND',hdr:'HDR',evidence:'EVID'}[mEnt];row.id=`${px}-${String(data.length+1).padStart(3,'0')}`;data.push(row);}
  else{row.id=data[mIdx].id;data[mIdx]=row;}
  STORE.set(mEnt,data);closeModal();rp(page);
}

function bf(e,r){
  const f=(k,l,t='text',req=false)=>`<div class="form-row${req?' req':''}"><label>${l}</label><input type="${t}" data-field="${k}" value="${(r[k]||'').toString().replace(/"/g,'&quot;')}" placeholder="${l}"></div>`;
  const fs=(k,l,opts,req=false)=>`<div class="form-row${req?' req':''}"><label>${l}</label><select data-field="${k}">${opts.map(o=>`<option value="${o}"${o===(r[k]||opts[0])?' selected':''}>${o}</option>`).join('')}</select></div>`;
  const ft=(k,l)=>`<div class="form-row"><label>${l}</label><textarea data-field="${k}" placeholder="${l}">${r[k]||''}</textarea></div>`;
  if(e==='projects')return`<div class="form-grid">${f('title','Project title','text',true)}${fs('status','Status',LISTS.status,true)}${f('unit','Lead unit')}${fs('phase','Phase',LISTS.phase)}${fs('region','Region',LISTS.region,true)}${fs('country','Country',LISTS.country)}${fs('focus','Focus area',LISTS.focus)}${fs('scheme','Funding scheme',LISTS.scheme)}${f('partner_id','Primary partner ID')}${f('partner','Primary partner name')}${f('start','Start date','date')}${f('end','End date','date')}${f('target','Target income AUD','number')}${f('actual','Actual income AUD','number')}${f('hdr_target','HDR target','number')}${f('hdr_actual','HDR actual','number')}${fs('risk','Risk level',LISTS.risk)}${fs('decision','Decision required?',LISTS.yesno)}${f('lead','Project lead')}${fs('update_flag','Weekly update flag',LISTS.flag)}</div>${ft('decision_detail','Decision detail')}${ft('notes','Notes')}`;
  if(e==='tasks')return`<div class="form-grid">${f('title','Task title','text',true)}${fs('status','Status',LISTS.taskStatus,true)}${f('project_id','Linked project ID')}${f('project','Project name')}${f('partner_id','Linked partner ID')}${f('partner','Partner name')}${f('owner','Owner')}${fs('priority','Priority',LISTS.priority)}${f('due','Due date','date')}${f('completed','Completed date','date')}${fs('risk','Risk',LISTS.risk)}${fs('decision','Decision required?',LISTS.yesno)}${fs('update_flag','Weekly update flag',LISTS.flag)}</div>${ft('decision_detail','Decision detail')}${ft('blocker','Blocker detail')}${ft('notes','Notes')}`;
  if(e==='partners')return`<div class="form-grid">${f('name','Institution name','text',true)}${f('acronym','Acronym')}${fs('country','Country',LISTS.country)}${fs('region','Region',LISTS.region)}${fs('type','Partner type',LISTS.partnerType)}${fs('tier','Tier',LISTS.tier)}${fs('agreement','Agreement type',LISTS.agreement)}${f('expiry','Agreement expiry','date')}${f('contact','Primary contact')}${f('email','Contact email','email')}${f('lead','Flinders lead')}${fs('risk','Risk',LISTS.risk)}${f('qs','QS ranking','number')}${f('fwci','FWCI','number')}${f('pubs','Joint pubs 5yr','number')}${f('hdr','HDR supported','number')}</div>${ft('focus','Focus areas')}${ft('value','Strategic value')}${ft('notes','Notes')}`;
  if(e==='funding')return`<div class="form-grid">${f('title','Opportunity title','text',true)}${fs('scheme','Scheme',LISTS.scheme,true)}${fs('status','Status',LISTS.fundingStatus,true)}${fs('risk','Risk',LISTS.risk)}${f('project_id','Linked project ID')}${f('project','Project name')}${f('partner_id','Partner ID')}${f('partner','Partner name')}${fs('focus','Focus area',LISTS.focus)}${fs('region','Region',LISTS.region)}${f('eoi','EoI deadline','date')}${f('full_app','Full app deadline','date')}${f('decision_exp','Decision expected','date')}${f('requested','Amount requested AUD','number')}${f('awarded','Amount awarded AUD','number')}${f('lead','Lead applicant')}${f('role','Partner role')}${f('flinders_share','Flinders share 0 to 1','number')}${fs('decision','Decision required?',LISTS.yesno)}${fs('update_flag','Weekly update flag',LISTS.flag)}</div>${ft('decision_detail','Decision detail')}${ft('notes','Notes')}`;
  if(e==='hdr')return`<div class="form-grid">${f('name','Candidate or initiative name','text',true)}${fs('type','HDR type',LISTS.hdrType,true)}${fs('status','Status',LISTS.hdrStatus,true)}${fs('risk','Risk',LISTS.risk)}${f('project_id','Linked project ID')}${f('project','Project name')}${f('partner_id','Partner ID')}${f('partner','Partner name')}${f('flinders_sup','Flinders supervisor')}${f('partner_sup','Partner supervisor')}${fs('mobility','Mobility type',LISTS.mobility)}${f('discipline','Discipline')}${fs('focus','Focus area',LISTS.focus)}${fs('region','Region',LISTS.region)}${f('start','Start date','date')}${f('end','Expected end date','date')}${f('stipend_src','Stipend source')}${f('stipend','Stipend annual AUD','number')}${fs('cotutelle','Cotutelle agreement?',LISTS.yesno)}${f('agreement_date','Agreement date','date')}${fs('update_flag','Weekly update flag',LISTS.flag)}</div>${ft('milestone','Next milestone')}${ft('notes','Notes')}`;
  if(e==='evidence')return`<div class="form-grid">${f('title','Evidence title','text',true)}${fs('type','Type',LISTS.evidenceType,true)}${f('date','Date recorded','date',true)}${f('added_by','Added by')}${f('project_id','Linked project ID')}${f('project','Project name')}${f('task_id','Linked task ID')}${f('partner_id','Linked partner ID')}${f('funding_id','Linked funding ID')}${f('hdr_id','Linked HDR ID')}${f('link','Document link or DOI')}${fs('update_flag','Weekly update flag',LISTS.flag)}</div>${ft('description','Description')}${ft('notes','Notes')}`;
  return'<p>Form not defined.</p>';
}

document.getElementById('modal-close').onclick=closeModal;
document.getElementById('modal-cancel').onclick=closeModal;
document.getElementById('modal-save').onclick=saveModal;
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay'))closeModal();});
document.querySelectorAll('.nav-item[data-page]').forEach(el=>el.addEventListener('click',()=>nav(el.dataset.page)));
STORE.init();
nav('start');
</script>
</body>
</html>
